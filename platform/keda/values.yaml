---
# kedacore/keda. Scales the predictor on in-flight requests per replica (ADR-008).
resources:
  operator:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  metricServer:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  webhooks:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
