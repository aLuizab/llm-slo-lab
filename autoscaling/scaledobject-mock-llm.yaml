---
# Plain KEDA ScaledObject for mock-llm (a Deployment, not an InferenceService). Used in CI,
# and it documents what KServe generates from the InferenceService `autoScaling` block.
# Same signal: in-flight requests at the gateway, one replica per concurrent request.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mock-llm
  namespace: llm
spec:
  scaleTargetRef:
    name: mock-llm
  minReplicaCount: 1
  maxReplicaCount: 3
  # pollingInterval / cooldownPeriod only matter with scale-to-zero (KEDA warns otherwise);
  # the HPA behavior below governs 1..3.
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 2, periodSeconds: 30}
        scaleDown:
          stabilizationWindowSeconds: 90
          policies:
            - {type: Pods, value: 1, periodSeconds: 30}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.observability.svc:9090
        query: avg_over_time(sum(llm_slo_requests_in_flight)[1m:10s])
        threshold: "1"
        activationThreshold: "0"
