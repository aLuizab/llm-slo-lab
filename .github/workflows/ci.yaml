---
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  lint-test:
    name: lint, unit tests, rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Toolchain (promtool, kubeconform, yamllint, kind, kubectl, helm) into ~/.local/bin
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sync Python projects
        run: for p in gateway mock-llm eval loadgen slo dashboards; do (cd $p && uv sync --frozen --all-groups); done
      - name: Tokenizer for gateway tests (pinned model revision)
        run: |
          source versions.env
          uv run --no-project --with "huggingface_hub==$HF_HUB_VERSION" python - <<EOF
          import os
          from huggingface_hub import hf_hub_download
          d = os.path.expanduser("~/.cache/llm-slo-lab/models/qwen2.5-0.5b-instruct")
          hf_hub_download("$MODEL_ID", "tokenizer.json", revision="$MODEL_REVISION", local_dir=d)
          EOF
      - name: ruff, yamllint, kubeconform
        run: make lint
      - name: Unit tests (gateway, mock-llm, evaluator)
        run: make test
      - name: Generated files are current (rules, dashboard)
        run: |
          make slo-gen dashboard-gen
          git diff --exit-code -- slo dashboards
      - name: promtool check + test
        run: make slo-check

  docker:
    name: docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          source versions.env
          docker build -t llm-slo-lab/mock-llm:dev mock-llm
          docker build -t llm-slo-lab/evaluator:dev eval
          docker build -t llm-slo-lab/llm-gateway:dev \
            --build-arg MODEL_ID="$MODEL_ID" --build-arg MODEL_REVISION="$MODEL_REVISION" \
            --build-arg HF_HUB_VERSION="$HF_HUB_VERSION" gateway

  e2e:
    name: e2e on kind (mock-llm)
    runs-on: ubuntu-latest
    needs: [lint-test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Toolchain
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: kind cluster
        run: make cluster
      - name: Build and load images (no model, no KServe in CI)
        run: |
          source versions.env
          docker build -t llm-slo-lab/mock-llm:dev mock-llm
          docker build -t llm-slo-lab/evaluator:dev eval
          docker build -t llm-slo-lab/llm-gateway:dev \
            --build-arg MODEL_ID="$MODEL_ID" --build-arg MODEL_REVISION="$MODEL_REVISION" \
            --build-arg HF_HUB_VERSION="$HF_HUB_VERSION" gateway
          for i in mock-llm evaluator llm-gateway; do kind load docker-image llm-slo-lab/$i:dev --name llm-slo-lab; done
      - name: Platform (kube-prometheus-stack, otel-collector, KEDA)
        run: make platform-monitoring platform-otel platform-keda
      - name: Sync loadgen
        run: cd loadgen && uv sync --frozen
      - name: e2e
        run: scripts/e2e.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n llm describe pods | tail -100
          kubectl -n llm logs deploy/llm-gateway --tail=100 || true
          kubectl -n observability logs deploy/otel-collector --tail=50 || true
