[project]
name = "evaluator"
version = "0.1.0"
description = "Runs the golden dataset against the gateway and emits the quality signal over OTLP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
