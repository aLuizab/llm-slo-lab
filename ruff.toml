line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF012"]

[lint.isort]
known-first-party = ["app", "mock_llm", "tests", "evaluator", "loadgen"]

[lint.per-file-ignores]
# long PromQL literals read better unbroken
"dashboards/gen_dashboard.py" = ["E501"]

[format]
quote-style = "double"
