---
# One-off download of the model weights into the model-cache PVC. Idempotent: snapshot_download
# resumes and skips files that are already present. Placeholders are filled from versions.env
# by `make model-cache`.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: llm
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: download
          image: python:${PYTHON_VERSION}-slim
          env:
            - name: MODEL_ID
              value: "${MODEL_ID}"
            - name: MODEL_DIR
              value: "/mnt/models/${MODEL_DIRNAME}"
            - name: HF_HUB_VERSION
              value: "${HF_HUB_VERSION}"
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --quiet --no-cache-dir "huggingface_hub==${HF_HUB_VERSION}"
              python - <<'EOF'
              import os
              from huggingface_hub import snapshot_download
              path = snapshot_download(
                  os.environ["MODEL_ID"],
                  local_dir=os.environ["MODEL_DIR"],
                  allow_patterns=["*.json", "*.safetensors", "*.txt", "*.jinja"],
              )
              print("model at", path)
              for name in sorted(os.listdir(path)):
                  print(f"  {os.path.getsize(os.path.join(path, name)):>12}  {name}")
              EOF
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: models
              mountPath: /mnt/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
