---
# CPU profile: KServe Hugging Face runtime, plain transformers backend (no vLLM), fp32.
# Served model name: qwen2.5-0.5b-instruct (OpenAI `model` field).
# Weights come from the model-cache PVC (model/model-cache.yaml, filled by model/download-job.yaml).
#
# Autoscaling (ADR-008): KServe's native KEDA integration. KServe creates and owns a
# ScaledObject from `autoScaling` below and creates no HPA of its own. The signal is the
# gateway's in-flight gauge (llm_slo_requests_in_flight), pushed over OTLP into Prometheus:
# one replica per concurrent request, because the HF backend serves one request at a time.
# maxReplicas is 2 on the laptop profile: each fp32 replica is ~2.6 GB RSS and ~3 cores while
# loading or generating; a third replica oversubscribed 8 CPUs / 12 GB and starved the gateway
# (ADR-018). Raise it on a bigger node.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen
  namespace: llm
  annotations:
    serving.kserve.io/autoscalerClass: keda
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    autoScaling:
      metrics:
        - type: External
          external:
            metric:
              backend: prometheus
              serverAddress: http://kube-prometheus-stack-prometheus.observability.svc:9090
              # average in-flight requests over the last minute (gateway pushes every 10 s)
              query: avg_over_time(sum(llm_slo_requests_in_flight)[1m:10s])
            target:
              type: Value
              value: "1"
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Pods, value: 2, periodSeconds: 30}
        scaleDown:
          stabilizationWindowSeconds: 90
          policies:
            - {type: Pods, value: 1, periodSeconds: 30}
    model:
      modelFormat:
        name: huggingface
      storageUri: pvc://model-cache/qwen2.5-0.5b-instruct
      args:
        - --model_name=qwen2.5-0.5b-instruct
        - --backend=huggingface
        - --dtype=float32
        - --max_model_len=2048
      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: OMP_NUM_THREADS
          value: "3"
      resources:
        requests: {cpu: "1500m", memory: 2500Mi}
        limits: {cpu: "3", memory: 3Gi}
