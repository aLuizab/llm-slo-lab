    - record: slodemo:sli_error:ratio_rate10m
      expr: clamp_min(1 - (sum(rate(llm_slo_output_tokens_per_second_count[10m])) - sum(rate(llm_slo_output_tokens_per_second_bucket{le="3"}[10m])))
