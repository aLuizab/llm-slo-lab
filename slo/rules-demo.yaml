      labels: *id003
    - record: slodemo:burn_rate:rate3m
      expr: slodemo:sli_error:ratio_rate3m{sli="throughput"} / 0.1
      labels: *id003
    - record: slodemo:sli_error:ratio_rate6m
      expr: clamp_min(1 - (sum(rate(llm_slo_output_tokens_per_second_count[6m])) - sum(rate(llm_slo_output_tokens_per_second_bucket{le="3"}[6m])))
