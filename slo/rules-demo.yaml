    - record: slodemo:cost_per_1k_requests:rate5m
      expr: 1000 * sum by (llm_slo_cost_model) (rate(llm_slo_request_cost_sum[5m])) / sum by (llm_slo_cost_model)
        (rate(llm_slo_request_cost_count[5m]))
      labels:
        slo_mode: demo
        slo_profile: cpu
    interval: 15s
  - name: llm-slo-demo.alerts
    rules:
    - alert: LLMAvailabilityBurnRatePageDemo
      expr: (slodemo:burn_rate:rate3m{sli="availability"} > 14.4 and slodemo:burn_rate:rate1m{sli="availability"}
        > 14.4) or (slodemo:burn_rate:rate6m{sli="availability"} > 6 and slodemo:burn_rate:rate2m{sli="availability"}
        > 6)
      for: 0m
      labels:
        severity: page
        sli: availability
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] availability SLO (99%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 3m/1m at 14.4x or 6m/2m at 6x (demo windows). A request is good when the gateway returns
          a non-error, non-empty, non-truncated response. Upstream errors, timeouts, empty bodies, truncation at
          max_tokens and injected faults are bad events.
        runbook: docs/framework.md
    - alert: LLMAvailabilityBurnRateTicketDemo
      expr: (slodemo:burn_rate:rate10m{sli="availability"} > 3 and slodemo:burn_rate:rate3m{sli="availability"}
        > 3) or (slodemo:burn_rate:rate20m{sli="availability"} > 1 and slodemo:burn_rate:rate6m{sli="availability"}
        > 1)
      for: 0m
      labels:
        severity: ticket
        sli: availability
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] availability SLO (99%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 10m/3m at 3x or 20m/6m at 1x (demo windows). A request is good when the gateway returns
          a non-error, non-empty, non-truncated response. Upstream errors, timeouts, empty bodies, truncation at
          max_tokens and injected faults are bad events.
        runbook: docs/framework.md
    - alert: LLMResponsivenessBurnRatePageDemo
      expr: (slodemo:burn_rate:rate3m{sli="responsiveness"} > 14.4 and slodemo:burn_rate:rate1m{sli="responsiveness"}
        > 14.4) or (slodemo:burn_rate:rate6m{sli="responsiveness"} > 6 and slodemo:burn_rate:rate2m{sli="responsiveness"}
        > 6)
      for: 0m
      labels:
        severity: page
        sli: responsiveness
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] responsiveness SLO (95%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 3m/1m at 14.4x or 6m/2m at 6x (demo windows). Time to first token below the profile
          threshold. Only requests that produced a first token are counted here; failures are already bad events
          for availability.
        runbook: docs/framework.md
    - alert: LLMResponsivenessBurnRateTicketDemo
      expr: (slodemo:burn_rate:rate10m{sli="responsiveness"} > 3 and slodemo:burn_rate:rate3m{sli="responsiveness"}
        > 3) or (slodemo:burn_rate:rate20m{sli="responsiveness"} > 1 and slodemo:burn_rate:rate6m{sli="responsiveness"}
        > 1)
      for: 0m
      labels:
        severity: ticket
        sli: responsiveness
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] responsiveness SLO (95%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 10m/3m at 3x or 20m/6m at 1x (demo windows). Time to first token below the profile
          threshold. Only requests that produced a first token are counted here; failures are already bad events
          for availability.
        runbook: docs/framework.md
    - alert: LLMThroughputBurnRatePageDemo
      expr: (slodemo:burn_rate:rate3m{sli="throughput"} > 8 and slodemo:burn_rate:rate1m{sli="throughput"} > 8)
        or (slodemo:burn_rate:rate6m{sli="throughput"} > 5 and slodemo:burn_rate:rate2m{sli="throughput"} > 5)
      for: 0m
      labels:
        severity: page
        sli: throughput
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] throughput SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 3m/1m at 8x or 6m/2m at 5x (demo windows). Output tokens per second above the profile
          threshold, measured per request after the first token.
        runbook: docs/framework.md
    - alert: LLMThroughputBurnRateTicketDemo
      expr: (slodemo:burn_rate:rate10m{sli="throughput"} > 3 and slodemo:burn_rate:rate3m{sli="throughput"} > 3)
        or (slodemo:burn_rate:rate20m{sli="throughput"} > 1 and slodemo:burn_rate:rate6m{sli="throughput"} > 1)
      for: 0m
      labels:
        severity: ticket
        sli: throughput
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] throughput SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: Windows 10m/3m at 3x or 20m/6m at 1x (demo windows). Output tokens per second above the profile
          threshold, measured per request after the first token.
        runbook: docs/framework.md
    - alert: LLMQualityBurnRatePageDemo
      expr: (slodemo:burn_rate:rate3m{sli="quality"} > 8 and slodemo:burn_rate:rate1m{sli="quality"} > 8) or (slodemo:burn_rate:rate6m{sli="quality"}
        > 5 and slodemo:burn_rate:rate2m{sli="quality"} > 5)
      for: 0m
      labels:
        severity: page
        sli: quality
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] quality SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: 'Windows 3m/1m at 8x or 6m/2m at 5x (demo windows). Deterministic evaluation checks (eval/golden.jsonl)
          passing: keywords present, valid JSON matching a schema, refusal when required, length cap. A proxy for
          quality, not a measure of it (see README limitations).'
        runbook: docs/framework.md
    - alert: LLMQualityBurnRateTicketDemo
      expr: (slodemo:burn_rate:rate10m{sli="quality"} > 3 and slodemo:burn_rate:rate3m{sli="quality"} > 3) or (slodemo:burn_rate:rate20m{sli="quality"}
        > 1 and slodemo:burn_rate:rate6m{sli="quality"} > 1)
      for: 0m
      labels:
        severity: ticket
        sli: quality
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] quality SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x'
        description: 'Windows 10m/3m at 3x or 20m/6m at 1x (demo windows). Deterministic evaluation checks (eval/golden.jsonl)
          passing: keywords present, valid JSON matching a schema, refusal when required, length cap. A proxy for
          quality, not a measure of it (see README limitations).'
        runbook: docs/framework.md
    - alert: LLMCostBudgetExceededDemo
      expr: slodemo:cost_per_1k_requests:rate5m{llm_slo_cost_model="amortized"} > 1.5
      for: 1m
      labels:
        severity: ticket
        sli: cost
        slo_mode: demo
        slo_profile: cpu
      annotations:
        summary: '[DEMO] cost per 1k requests is {{ $value | printf "%.2f" }} USD, budget 1.5 (amortized model;
          assumptions, not real prices)'
        runbook: docs/framework.md
    interval: 15s
