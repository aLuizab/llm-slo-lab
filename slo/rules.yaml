  - name: llm-slo-prod.alerts
    rules:
    - alert: LLMAvailabilityBurnRatePage
      expr: (slo:burn_rate:rate1h{sli="availability"} > 14.4 and slo:burn_rate:rate5m{sli="availability"} > 14.4)
        or (slo:burn_rate:rate6h{sli="availability"} > 6 and slo:burn_rate:rate30m{sli="availability"} > 6)
      for: 2m
      labels:
        severity: page
        sli: availability
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: availability SLO (99%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: Windows 1h/5m at 14.4x or 6h/30m at 6x (prod windows). A request is good when the gateway returns
          a non-error, non-empty, non-truncated response. Upstream errors, timeouts, empty bodies, truncation at
          max_tokens and injected faults are bad events.
        runbook: docs/framework.md
    - alert: LLMAvailabilityBurnRateTicket
      expr: (slo:burn_rate:rate1d{sli="availability"} > 3 and slo:burn_rate:rate2h{sli="availability"} > 3) or (slo:burn_rate:rate3d{sli="availability"}
        > 1 and slo:burn_rate:rate6h{sli="availability"} > 1)
      for: 15m
      labels:
        severity: ticket
        sli: availability
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: availability SLO (99%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: Windows 1d/2h at 3x or 3d/6h at 1x (prod windows). A request is good when the gateway returns
          a non-error, non-empty, non-truncated response. Upstream errors, timeouts, empty bodies, truncation at
          max_tokens and injected faults are bad events.
        runbook: docs/framework.md
    - alert: LLMResponsivenessBurnRatePage
      expr: (slo:burn_rate:rate1h{sli="responsiveness"} > 14.4 and slo:burn_rate:rate5m{sli="responsiveness"} >
        14.4) or (slo:burn_rate:rate6h{sli="responsiveness"} > 6 and slo:burn_rate:rate30m{sli="responsiveness"}
        > 6)
      for: 2m
      labels:
        severity: page
        sli: responsiveness
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: responsiveness SLO (95%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: Windows 1h/5m at 14.4x or 6h/30m at 6x (prod windows). Time to first token below the profile
          threshold. Only requests that produced a first token are counted here; failures are already bad events
          for availability.
        runbook: docs/framework.md
    - alert: LLMResponsivenessBurnRateTicket
      expr: (slo:burn_rate:rate1d{sli="responsiveness"} > 3 and slo:burn_rate:rate2h{sli="responsiveness"} > 3)
        or (slo:burn_rate:rate3d{sli="responsiveness"} > 1 and slo:burn_rate:rate6h{sli="responsiveness"} > 1)
      for: 15m
      labels:
