        sli: responsiveness
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: responsiveness SLO (95%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: Windows 1d/2h at 3x or 3d/6h at 1x (prod windows). Time to first token below the profile threshold.
          Only requests that produced a first token are counted here; failures are already bad events for availability.
        runbook: docs/framework.md
    - alert: LLMThroughputBurnRatePage
      expr: (slo:burn_rate:rate1h{sli="throughput"} > 8 and slo:burn_rate:rate5m{sli="throughput"} > 8) or (slo:burn_rate:rate6h{sli="throughput"}
