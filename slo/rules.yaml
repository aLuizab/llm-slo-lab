        runbook: docs/framework.md
    - alert: LLMQualityBurnRatePage
      expr: (slo:burn_rate:rate1h{sli="quality"} > 5 and slo:burn_rate:rate5m{sli="quality"} > 5)
      for: 2m
      labels:
        severity: page
        sli: quality
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: quality SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: 'Windows 1h/5m at 5x (prod windows). Deterministic evaluation checks (eval/golden.jsonl) passing:
          keywords present, valid JSON matching a schema, refusal when required, length cap. A proxy for quality,
          not a measure of it (see README limitations).'
        runbook: docs/framework.md
    - alert: LLMQualityBurnRateTicket
      expr: (slo:burn_rate:rate1d{sli="quality"} > 3 and slo:burn_rate:rate2h{sli="quality"} > 3) or (slo:burn_rate:rate3d{sli="quality"}
        > 1 and slo:burn_rate:rate6h{sli="quality"} > 1)
      for: 15m
      labels:
        severity: ticket
        sli: quality
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: quality SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: 'Windows 1d/2h at 3x or 3d/6h at 1x (prod windows). Deterministic evaluation checks (eval/golden.jsonl)
          passing: keywords present, valid JSON matching a schema, refusal when required, length cap. A proxy for
          quality, not a measure of it (see README limitations).'
        runbook: docs/framework.md
    - alert: LLMCostBudgetExceeded
      expr: slo:cost_per_1k_requests:rate1h{llm_slo_cost_model="amortized"} > 1.5
      for: 10m
      labels:
        severity: ticket
        sli: cost
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: cost per 1k requests is {{ $value | printf "%.2f" }} USD, budget 1.5 (amortized model; assumptions,
          not real prices)
        runbook: docs/framework.md
