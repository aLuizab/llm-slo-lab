        sli: throughput
        slo_mode: prod
        slo_profile: cpu
      annotations:
        summary: throughput SLO (90%) is burning error budget at {{ $value | printf "%.1f" }}x
        description: Windows 1h/5m at 8x or 6h/30m at 5x (prod windows). Output tokens per second above the profile
          threshold, measured per request after the first token.
        runbook: docs/framework.md
    - alert: LLMThroughputBurnRateTicket
      expr: (slo:burn_rate:rate1d{sli="throughput"} > 3 and slo:burn_rate:rate2h{sli="throughput"} > 3) or (slo:burn_rate:rate3d{sli="throughput"}
