[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible proxy that measures LLM SLIs and emits OpenTelemetry GenAI telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "tokenizers>=0.20",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-semantic-conventions==0.66b1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
